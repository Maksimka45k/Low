<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Low · Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<section id="login">
  <div class="card">
    <h1>LOW · ADMIN</h1>
    <input id="email" type="email" placeholder="email" autocomplete="username">
    <input id="pass" type="password" placeholder="пароль" autocomplete="current-password">
    <button id="login-btn" class="btn primary">ВОЙТИ</button>
    <div id="login-err" class="err"></div>
  </div>
</section>
<section id="app" hidden>
  <header>
    <b>LOW · ADMIN</b><span id="stats"></span>
    <button id="logout" class="btn">Выйти</button>
  </header>
  <nav>
    <button class="btn tab on" data-tab="users">Пользователи</button>
    <button class="btn tab" data-tab="chats">Чаты и каналы</button>
    <button class="btn tab" data-tab="moments">Моменты</button>
    <button class="btn tab" data-tab="log">Журнал</button>
    <input id="q" placeholder="поиск: ник, имя, uid, название…">
  </nav>
  <main id="list"></main>
</section>
<dialog id="dlg">
  <h3 id="dlg-title"></h3>
  <select id="dlg-dur">
    <option value="3600">1 час</option><option value="86400">1 день</option>
    <option value="604800">7 дней</option><option value="2592000">30 дней</option>
    <option value="0">навсегда</option>
  </select>
  <input id="dlg-reason" maxlength="200" placeholder="причина (необязательно)">
  <input id="dlg-word">
  <div class="acts"><button id="dlg-no" class="btn">Отмена</button><button id="dlg-ok" class="btn primary">Подтвердить</button></div>
</dialog>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
